name: Docker system prune

on:
  workflow_dispatch:
    inputs:
      flags:
        description: Flags passed to docker system prune
        type: string
        default: "-af"

permissions:
  contents: read

concurrency:
  group: docker-prune
  cancel-in-progress: false

jobs:
  prune:
    runs-on: self-hosted
    steps:
      - name: Verify Docker is available
        run: docker version

      - name: Disk usage before prune
        run: docker system df

      - name: Prune stopped containers, unused networks, dangling images and build cache
        run: docker system prune ${{ inputs.flags }}

      - name: Disk usage after prune
        run: docker system df
